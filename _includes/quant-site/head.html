<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<meta name="robots" content="index, follow">
<title>{{ page.title | default: 'Quant Portfolio' }} · Théo Verdelhan</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.schema_type == 'TechArticle' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }} · Théo Verdelhan">
<meta property="og:description" content="{{ page.description | default: site.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/images/social/portfolio-og.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Théo Verdelhan quantitative research portfolio">
{% if page.schema_date_created %}<meta property="article:published_time" content="{{ page.schema_date_created | date_to_xmlschema }}">{% endif %}
{% if page.schema_date_modified %}<meta property="article:modified_time" content="{{ page.schema_date_modified | date_to_xmlschema }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }} · Théo Verdelhan">
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
<meta name="twitter:image" content="{{ '/images/social/portfolio-og.png' | absolute_url }}">
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/quant-site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% include structured-data.html title=page.title description=page.description %}
