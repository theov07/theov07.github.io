<section class="project-profile-section" aria-label="Project profile">
  <div class="rp-shell">
    <dl class="project-profile">
      <div class="project-profile__status">
        <dt>Status</dt>
        <dd><span class="status-dot" aria-hidden="true"></span>Public</dd>
      </div>
      <div>
        <dt>Period · Git history</dt>
        <dd>{{ include.period }}</dd>
      </div>
      <div>
        <dt>Role</dt>
        <dd>{{ include.role }}</dd>
      </div>
      <div>
        <dt>Team</dt>
        <dd>{{ include.team }}</dd>
      </div>
      <div>
        <dt>Data</dt>
        <dd>{{ include.data }}</dd>
      </div>
      <div>
        <dt>Research artifacts</dt>
        <dd>{{ include.artifacts }}</dd>
      </div>
    </dl>
  </div>
</section>
