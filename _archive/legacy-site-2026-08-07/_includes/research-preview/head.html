<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="robots" content="index, follow">
<meta name="description" content="{{ include.description | escape }}">
<title>{{ include.title | escape }} · Théo Verdelhan</title>
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ include.title | escape }} · Théo Verdelhan">
<meta property="og:description" content="{{ include.description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/images/social/portfolio-og.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Théo Verdelhan quantitative research portfolio">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ include.title | escape }} · Théo Verdelhan">
<meta name="twitter:description" content="{{ include.description | escape }}">
<meta name="twitter:image" content="{{ '/images/social/portfolio-og.png' | absolute_url }}">
<link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/research-preview.css' | relative_url }}">
{% include structured-data.html title=include.title description=include.description %}
