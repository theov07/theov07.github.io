# ================================
# Basic Site Settings
# ================================
locale: "en-US"
site_theme: "default"

title: "Théo Verdelhan"
title_separator: "-"
name: &name "Théo Verdelhan"
description: &description "Quantitative Researcher | Financial Engineering | Algorithmic Trading | Crypto & DeFi"

url: "https://theov07.github.io"
baseurl: ""
repository: "theov07/theov07.github.io"

# ================================
# Author (Sidebar)
# ================================
author:
  avatar: "profile.png"
  name: "Théo Verdelhan"
  bio: "Quantitative researcher focused on market microstructure, algorithmic trading, and machine learning applied to crypto and financial markets."
  location: "Paris, France"
  employer: "Paris Dauphine University – PSL"
  email: "theo.verdelhan@dauphine.eu"

  # Academic profiles (optional)
  googlescholar:
  orcid:

  # Code & data
  github: "theov07"

  # Social
  linkedin: "theoverdelhan"

# ================================
# Site Settings
# ================================
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"

# ================================
# Analytics (optional)
# ================================
analytics:
  provider: false

# ================================
# Files
# ================================
include:
  - .htaccess
  - _pages
  - files

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README

markdown: kramdown
highlighter: rouge
timezone: Etc/UTC

# ================================
# Collections
# ================================
collections:
  publications:
    output: true
  talks:
    output: true
  teaching:
    output: true
  portfolio:
    output: true

# ================================
# Defaults
# ================================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# ================================
# Plugins
# ================================
plugins:
  - jekyll-feed
  - jekyll-sitemap