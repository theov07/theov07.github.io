# ================================
# Basic Site Settings
# ================================
locale: "en-US"
site_theme: "contrast"

title: "Théo Verdelhan"
title_separator: "-"
name: &name "Théo Verdelhan"
description: &description "Quantitative researcher focused on market microstructure, systematic trading, derivatives pricing, and execution-aware research."

url: "https://theov07.github.io"
baseurl: ""
repository: "theov07/theov07.github.io"

# ================================
# Author (Sidebar)
# ================================
author:
  avatar: "avatar.webp"
  name: "Théo Verdelhan"
  bio: "Quantitative Research Intern @ Silvertrain AI | Financial Engineering @ Dauphine-PSL | Computer Science & ML @ EPF"
  location: "Paris, France"
  employer: "Silvertrain AI"
  email: "theo.verdelhan@dauphine.eu"

  # Academic profiles (optional)
  googlescholar:
  orcid:

  # Code & data
  github: "theov07"

  # Social
  linkedin: "theoverdelhan"

# ================================
# Site Settings
# ================================
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"

# ================================
# Analytics (optional)
# ================================
analytics:
  provider: custom

og_description: "Quantitative research portfolio by Théo Verdelhan, focused on market microstructure, systematic trading, execution and derivatives."

# ================================
# Files
# ================================
include:
  - .htaccess
  - _pages
  - files

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - package.json
  - LICENSE

markdown: kramdown
highlighter: rouge
timezone: Europe/Paris

# ================================
# Defaults
# ================================
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

# ================================
# Plugins
# ================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
